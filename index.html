/* ---------- daily recon ---------- */
async function renderDailyRecon() {
  const date = state.filters.report_date || today();
  $('#main').innerHTML = `
    <div class="titlebar">
      <div><h2>Recon for Daily Bank Balances</h2><div class="endpoint">GET <code>/finance/daily-recon</code> · opening and closing from the Daily Bank Report, movement by chart account group</div></div>
      <div style="display:flex;gap:6px"><button type="button" id="drSummary">Summary for this date</button><button type="button" id="drExport">Export CSV</button></div>
    </div>
    <form class="filters" id="drForm">
      <div class="f"><label>Report date</label><input type="date" name="report_date" value="${esc(date)}"></div>
      <div class="f" style="flex:0 0 auto;min-width:0"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="primary" type="submit">Run</button><button type="button" id="drToday">Today</button></div></div>
    </form>
    <div id="drBody"><div class="empty">Loading…</div></div>`;
  $('#drForm').onsubmit = ev => { ev.preventDefault(); state.filters = Object.fromEntries(new FormData(ev.target).entries()); renderDailyRecon(); };
  $('#drToday').onclick = () => { state.filters = {}; renderDailyRecon(); };
  $('#drSummary').onclick = () => { state.nextFilters = { report_date: date }; location.hash = 'daily-bank-summary'; };
  $('#drExport').onclick = async () => {
    // A plain link cannot send the bearer token, so fetch the file and save it.
    const url = state.base.replace(/\/+$/, '') + '/finance/daily-recon/export?report_date=' + encodeURIComponent(date);
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + state.token, Accept: 'text/csv' } });
    if (!res.ok) return toast('Export failed (' + res.status + ')', true);
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await res.blob()), download: `daily-recon-${date}.csv` });
    a.click(); URL.revokeObjectURL(a.href);
  };

  const res = await api('GET', '/finance/daily-recon', { query: { report_date: date } });
  if (state.current?.key !== 'daily-recon') return;
  if (res.status !== 200) { $('#drBody').innerHTML = `<div class="banner bad">${esc(apiError(res))}</div>`; return; }

  const d = res.json.data, base = d.base_currency;
  const amt = v => `<td class="num${v < 0 ? ' neg' : ''}">${v === 0 ? '-' : esc(money(v))}</td>`;
  const gap = '<tr><td colspan="2" style="padding:3px;background:var(--code)"></td></tr>';
  const sections = d.sections.map(s => `
    <tr><td colspan="2"><b style="color:var(--accent, #2563eb)">${esc(s.label)}</b>${s.has_missing_rate ? ' <span class="pill">missing rate</span>' : ''}</td></tr>
    ${s.accounts.map(a => `<tr><td style="padding-left:24px">${a.code ? `<span class="endpoint">${esc(a.code)}</span> ` : ''}${esc(a.name)}${
      a.slices.filter(x => x.currency !== base).map(x => ` <span class="endpoint">· ${esc(money(x.net_native))} ${esc(x.currency)}</span>`).join('')}</td>${amt(a.net_total)}</tr>`).join('')}
    <tr style="font-weight:600;border-top:2px solid var(--line)"><td>(${esc(s.letter)})</td>${amt(s.net_total)}</tr>${gap}`).join('');

  let warn = '';
  if (d.warnings?.missing_rates) warn += `<div class="banner bad">No exchange rate on or before this date for <b>${esc(d.warnings.missing_rates.join(', '))}</b>, so those amounts are left out.</div>`;
  if (d.warnings?.draft_count) warn += `<div class="banner">${d.warnings.draft_count} draft entr${d.warnings.draft_count === 1 ? 'y is' : 'ies are'} included on this date and not posted yet.</div>`;

  $('#drBody').innerHTML = `${warn}
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1 1 420px;min-width:0">
        <table><tbody>
          <tr style="font-weight:600"><td>Opening Balance (A)</td>${amt(d.opening_balance)}</tr>${gap}
          ${sections}
          <tr style="font-weight:600"><td>${esc(d.computed_label)}</td>${amt(d.computed_closing)}</tr>
          <tr style="font-weight:600"><td>Reported Closing Balance</td>${amt(d.reported_closing)}</tr>
          <tr style="font-weight:600;background:${d.is_balanced ? 'var(--ok-bg, #e7f6ec)' : 'var(--bad-bg)'}"><td>Difference</td>${amt(d.difference)}</tr>
        </tbody></table>
        <p class="endpoint">(A) is the total of every Daily Bank Report account's closing balance on ${esc(niceDate(d.previous_date))}. The lettered sections are ${esc(niceDate(d.report_date))}'s movement, grouped by the chart account group each entry was coded to. The reported closing balance is the same grand total the daily summary prints.</p>
      </div>
      <div style="flex:0 1 300px;border:1px solid var(--line);border-left:4px solid ${d.is_balanced ? '#16a34a' : 'var(--bad)'};border-radius:6px;padding:12px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:${d.is_balanced ? '#16a34a' : 'var(--bad)'}">${d.is_balanced ? 'Balanced' : 'Out of balance'}</div>
        <div style="font-size:20px;font-weight:700">${esc(base)} ${esc(money(Math.abs(d.difference)))}</div>
        <p class="endpoint" style="margin:6px 0 0">${d.is_balanced ? 'Opening balance plus the analysed movement equals the closing balance.' : 'Opening balance plus the analysed movement does not equal the closing balance.'}</p>
      </div>
    </div>`;
}

async function renderDailySummary() {
  const date = state.filters.report_date || today();
  $('#main').innerHTML = `
    <div class="titlebar">
      <div><h2>Daily Bank Report</h2><div class="endpoint">GET <code>/finance/daily-bank-summary</code> · from view <code>fm_daily_bank_summary_view</code> · accounts placed on the Daily Bank Report only</div></div>
    </div>
    <form class="filters" id="dsForm">
      <div class="f"><label>Report date</label><input type="date" name="report_date" value="${esc(date)}"></div>
      <div class="f" style="flex:0 0 auto;min-width:0"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="primary" type="submit">Run</button><button type="button" id="dsToday">Today</button></div></div>
    </form>
    <div id="dsBody"><div class="empty">Loading…</div></div>`;
  $('#dsForm').onsubmit = ev => { ev.preventDefault(); state.filters = Object.fromEntries(new FormData(ev.target).entries()); renderDailySummary(); };
  $('#dsToday').onclick = () => { state.filters = {}; renderDailySummary(); };

  const query = { report_date: date };
  const res = await api('GET', '/finance/daily-bank-summary', { query });
  if (state.current?.key !== 'daily-bank-summary') return;
  if (res.status !== 200) {
    $('#dsBody').innerHTML = `<div class="banner bad">${esc(apiError(res))}${res.status === 403 ? ' — your user is missing the fm.daily-bank-summary.index permission.' : ''}</div>`;
    return;
  }
  const d = res.json.data;
  const base = d.base_currency;
  const g = d.grand_total;
  const w = d.warnings || {};

  let warn = '';
  if (w.missing_rates) warn += `<div class="banner bad">No exchange rate on or before this date for: <b>${esc(w.missing_rates.join(', '))}</b>. Those lines are left out of the ${esc(base)} totals.</div>`;
  if (w.draft_count) warn += `<div class="banner">${w.draft_count} draft entr${w.draft_count === 1 ? 'y' : 'ies'} on this date ${w.draft_count === 1 ? 'is' : 'are'} included but not posted yet.</div>`;
  if (w.unclassified_report_ids) warn += `<div class="banner">Report lines with no category (shown under Unclassified): #${w.unclassified_report_ids.join(', #')}</div>`;
  if (w.multiple_category_report_ids) warn += `<div class="banner">Report lines linked to more than one category, shown only under the first: #${w.multiple_category_report_ids.join(', #')}</div>`;

  let body = '';
  for (const s of d.sections) {
    body += `<tr class="section"><td colspan="8">${esc(s.label)}</td></tr>`;
    for (const r of s.rows) {
      const acct = `${r.bank}${r.account_title ? ' · ' + r.account_title : ''}${r.account_last4 ? ` (••••${r.account_last4})` : ''}`;
      body += `<tr><td>${esc(r.region || '—')}</td><td>${esc(r.company || '—')}</td><td>${esc(acct)}${r.draft_count ? ` ${pill(r.draft_count + ' draft', 'warn').html}` : ''}</td><td>${esc(r.currency)}</td>
        ${moneyTd(r.last_balance)}${moneyTd(r.today_balance)}${moneyTd(r.change)}<td class="endpoint">${esc(r.remarks || '')}</td></tr>`;
    }
    for (const t of s.currency_totals) {
      body += `<tr class="subtotal"><td colspan="4" class="num">${esc(s.label)} total (${esc(t.currency)})</td>${moneyTd(t.last)}${moneyTd(t.today)}${moneyTd(t.change)}<td></td></tr>`;
      if (t.is_converted) {
        const rate = d.rates[t.currency];
        const note = rate ? `@ ${rate.rate}${rate.effective_date ? ' · rate effective ' + niceDate(rate.effective_date) : ''}` : 'no rate';
        body += `<tr class="subtotal usd"><td colspan="4" class="num">${esc(s.label)} total (${esc(base)}) <span class="rate">${esc(note)}</span></td>${moneyTd(t.last_usd)}${moneyTd(t.today_usd)}${moneyTd(t.change_usd)}<td></td></tr>`;
      }
    }
  }
  if (!d.sections.length) body = `<tr><td colspan="8"><div class="empty">No active report lines. Add Reports (with a category) for your bank accounts first.</div></td></tr>`;

  $('#dsBody').innerHTML = `
    <p class="endpoint">Balances as at <b>${esc(niceDate(d.report_date))}</b>, compared with <b>${esc(niceDate(d.previous_date))}</b>.</p>
    ${warn}
    <div class="kpis">
      <div class="kpi"><small>Last day total</small><b>${esc(base)} ${esc(money(g.last))}</b></div>
      <div class="kpi"><small>Today total</small><b>${esc(base)} ${esc(money(g.today))}</b></div>
      <div class="kpi" style="border-left-color:var(--ok)"><small>Increase / (Decrease)</small><b>${esc(base)} ${esc(money(g.change))}</b></div>
    </div>
    <div class="summary"><table>
      <thead><tr><th>Region</th><th>Company</th><th>Bank / Wallet</th><th>Ccy</th><th class="num">Last day balance</th><th class="num">Today balance</th><th class="num">Increase / (Decrease)</th><th>Remarks</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="grand"><td colspan="4" class="num">GRAND TOTAL (${esc(base)})${d.is_complete ? '' : ' — incomplete'}</td>${moneyTd(g.last).replace(' neg', '')}${moneyTd(g.today).replace(' neg', '')}${moneyTd(g.change).replace(' neg', '')}<td></td></tr></tfoot>
    </table></div>
    <p class="endpoint">Both balance columns use the rate in force on the report date, so the change column shows bank movement only, never currency movement.</p>`;
}

/* ---------- reference dropdowns ---------- */
async function loadRef(key) {
  if (state.refCache[key]) return state.refCache[key];
  const res = await api('GET', `/finance/${key}`, { query: { per_page: 500 } });
  state.refCache[key] = res.status === 200 ? res.json.data : [];
  return state.refCache[key];
}

function optionsHtml(rows, key, selected, multiple = false) {
  const sel = new Set([].concat(selected ?? []).map(String));
  return (multiple ? '' : '<option value="">—</option>') + rows.map(r =>
    `<option value="${r.id}" ${sel.has(String(r.id)) ? 'selected' : ''}>${esc(refLabel[key] ? refLabel[key](r) : '#' + r.id)}</option>`).join('');
}

/* ---------- list ---------- */
async function renderList() {
  const r = state.current;
  const main = $('#main');
  main.innerHTML = `
    <div class="titlebar">
      <div><h2>${esc(r.label)}</h2><div class="endpoint"><code>/finance/${esc(r.key)}</code></div></div>
      <div class="grow"></div>
      <button id="refresh">Refresh</button>
      ${r.readOnly ? '' : `<button class="primary" id="newBtn">${esc(r.createLabel || 'New')}</button>`}
    </div>
    ${r.note ? `<div class="banner">${esc(r.note)}</div>` : ''}
    <form class="filters" id="filters"></form>
    <div class="totals" id="totals"></div>
    <div id="table"><div class="empty">Loading…</div></div>
    <div class="pager" id="pager"></div>`;
  if (!r.readOnly) $('#newBtn').onclick = () => openForm(r, null);
  $('#refresh').onclick = () => loadList();
  await renderFilters(r);
  loadList();
}

async function renderFilters(r) {
  const form = $('#filters');
  let html = '';
  for (const f of r.filters || []) {
    const v = state.filters[f.name] ?? '';
    let input;
    if (f.type === 'ref') input = `<select name="${f.name}"><option value="">Any</option>${optionsHtml(await loadRef(f.ref), f.ref, v).replace('<option value="">—</option>', '')}</select>`;
    else if (f.type === 'select') input = `<select name="${f.name}"><option value="">Any</option>${f.options.map(o => `<option value="${esc(o.value)}" ${String(v) === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    else input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${f.name === 'search' ? 'placeholder="Search…"' : ''}>`;
    html += `<div class="f"><label>${esc(labelOf(f))}</label>${input}</div>`;
  }
  html += `<div class="f" style="flex:0 0 auto;min-width:0"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="primary" type="submit">Apply</button><button type="button" id="resetF">Reset</button></div></div>`;
  form.innerHTML = html;
  form.onsubmit = ev => {
    ev.preventDefault();
    state.filters = Object.fromEntries(new FormData(form).entries());
    state.page = 1;
    loadList();
  };
  $('#resetF').onclick = () => { state.filters = {}; state.page = 1; renderFilters(r); loadList(); };
}

async function loadList() {
  const r = state.current;
  const query = { ...state.filters, page: state.page, per_page: state.perPage };
  if (r.withTotals) query.with_totals = 1;
  const res = await api('GET', `/finance/${r.key}`, { query });
  if (state.current !== r) return;
  if (res.status !== 200) {
    $('#table').innerHTML = `<div class="banner bad">${esc(apiError(res))}${res.status === 403 ? ' — your user is missing the fm.' + esc(r.key) + '.index permission.' : ''}</div>`;
    $('#pager').innerHTML = '';
    return;
  }
  const rows = res.json.data || [];
  const meta = res.json.meta || {};
  const totals = res.json.totals || {};

  $('#totals').innerHTML = r.withTotals && Object.keys(totals).length
    ? `<span>Entries <b>${totals.total_transactions}</b></span><span>Credit <b>${totals.total_credit}</b></span><span>Debit <b>${totals.total_debit}</b></span><span>Net <b>${(totals.total_credit - totals.total_debit).toFixed(2)}</b></span><span>Draft <b>${totals.draft_count}</b></span><span>Posted <b>${totals.posted_count}</b></span>`
    : '';

  if (!rows.length) {
    $('#table').innerHTML = `<div class="empty">${r.readOnly ? 'Nothing here yet.' : `Nothing here yet. Use “${esc(r.createLabel || 'New')}” to add one.`}</div>`;
  } else {
    $('#table').innerHTML = `<table><thead><tr><th>ID</th>${r.columns.map(c => `<th class="${c[2] || ''}">${esc(c[0])}</th>`).join('')}<th></th></tr></thead><tbody>${
      rows.map((row, i) => `<tr><td>${row.id}</td>${r.columns.map(c => `<td class="${c[2] || ''}">${cell(c[1](row))}</td>`).join('')}<td class="actions">${
        (r.extraActions || []).filter(a => !a.when || a.when(row)).map((a, j) => `<button class="small" data-x="${j}" data-i="${i}">${esc(a.label)}</button>`).join('')
      }<button class="small" data-view="${i}">View</button>${
        r.readOnly || (r.editWhen && !r.editWhen(row)) ? '' : `<button class="small" data-edit="${i}">Edit</button>`}${
        r.readOnly || (r.deleteWhen && !r.deleteWhen(row)) ? '' : `<button class="small danger" data-del="${i}">Delete</button>`}</td></tr>`).join('')
    }</tbody></table>`;
    $('#table').onclick = ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.dataset.view !== undefined) viewRecord(r, rows[b.dataset.view]);
      if (b.dataset.edit !== undefined) openForm(r, rows[b.dataset.edit]);
      if (b.dataset.del !== undefined) deleteRecord(r, rows[b.dataset.del]);
      if (b.dataset.x !== undefined) r.extraActions.filter(a => !a.when || a.when(rows[b.dataset.i]))[b.dataset.x].run(rows[b.dataset.i]);
    };
  }

  $('#pager').innerHTML = `<span>${meta.total ?? 0} total · page ${meta.current_page ?? 1} of ${meta.last_page ?? 1}</span>
    <button class="small" id="prev" ${(meta.current_page ?? 1) <= 1 ? 'disabled' : ''}>Prev</button>
    <button class="small" id="next" ${(meta.current_page ?? 1) >= (meta.last_page ?? 1) ? 'disabled' : ''}>Next</button>`;
  $('#prev').onclick = () => { state.page--; loadList(); };
  $('#next').onclick = () => { state.page++; loadList(); };
}

/* ---------- dialog ---------- */
function openDialog(title, bodyHtml, footHtml) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = bodyHtml;
  $('#dlgFoot').innerHTML = footHtml;
  $('#dlg').showModal();
}
$('#dlg').addEventListener('click', ev => {
  if (ev.target.closest('[data-close]') || ev.target === $('#dlg')) $('#dlg').close();
});

async function viewRecord(r, row) {
  const res = await api('GET', `/finance/${r.key}/${row.id}/show`);
  openDialog(`${r.label} #${row.id}`, res.status === 200
    ? `<pre style="max-height:none">${esc(JSON.stringify(res.json.data, null, 2))}</pre>`
    : `<div class="banner bad">${esc(apiError(res))}</div>`, '<button data-close>Close</button>');
}

async function openForm(r, row) {
  const editing = !!row;
  let record = {};
  if (editing) {
    const res = await api('GET', `/finance/${r.key}/${row.id}/show`);
    if (res.status !== 200) return toast(apiError(res), true);
    record = res.json.data;
  }
  const fields = r.fields.filter(f => !(editing && f.createOnly));

  let html = '<div id="formErr"></div>';
  for (const f of fields) {
    let value;
    if (editing) value = f.type === 'multiref' ? (record[f.from] || []).map(x => x.id) : record[f.name];
    else value = typeof f.default === 'function' ? f.default() : f.default;
    const req = f.required ? ' <span class="req">*</span>' : '';
    let input;
    switch (f.type) {
      case 'textarea': input = `<textarea name="${f.name}">${esc(value)}</textarea>`; break;
      case 'bool': input = null; break;
      case 'select': input = `<select name="${f.name}"><option value="">—</option>${f.options.map(o => `<option value="${esc(o.value)}" ${String(value) === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`; break;
      case 'ref': input = `<select name="${f.name}">${optionsHtml(await loadRef(f.ref), f.ref, value)}</select>`; break;
      case 'multiref': input = `<select name="${f.name}" multiple>${optionsHtml(await loadRef(f.ref), f.ref, value, true)}</select>`; break;
      case 'date': input = `<input name="${f.name}" type="date" value="${esc(String(value ?? '').slice(0, 10))}">`; break;
      case 'number': input = `<input name="${f.name}" type="number" step="${f.step || 'any'}" value="${esc(value)}">`; break;
      default: input = `<input name="${f.name}" value="${esc(value)}">`;
    }
    html += f.type === 'bool'
      ? `<div class="field check" data-field="${f.name}"><label><input type="checkbox" name="${f.name}" ${value ? 'checked' : ''}> ${esc(labelOf(f))}</label></div>`
      : `<div class="field" data-field="${f.name}"><label>${esc(labelOf(f))}${req}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}${f.type === 'multiref' ? '<div class="hint">Ctrl/Cmd-click to pick several.</div>' : ''}</div>`;
  }

  const action = editing ? 'edit' : 'create';
  const endpoint = editing ? `/finance/${r.key}/${row.id}/edit` : `/finance/${r.key}/create`;
  openDialog(editing ? `Edit ${r.label} #${row.id}` : (r.createLabel || `New ${r.label}`),
    `<form id="recForm">${html}</form><div class="endpoint">POST <code>${esc(endpoint)}</code></div>`,
    `<button data-close>Cancel</button><button class="primary" id="saveBtn">${editing ? 'Save' : (r.createLabel || 'Create')}</button>`);

  $('#saveBtn').onclick = async () => {
    const form = $('#recForm');
    const body = {};
    for (const f of fields) {
      const el = form.elements[f.name];
      if (f.type === 'bool') body[f.name] = el.checked;
      else if (f.type === 'multiref') body[f.name] = [...el.selectedOptions].map(o => Number(o.value));
      else if (el.value === '') { if (editing) body[f.name] = null; }
      else if (f.type === 'ref' || f.type === 'number') body[f.name] = Number(el.value);
      else body[f.name] = el.value;
    }
    // Required fields are never sent as null on edit; leaving them blank sends nothing.
    for (const f of fields) if (f.required && body[f.name] === null) delete body[f.name];

    $('#saveBtn').disabled = true;
    const res = await api('POST', endpoint, { body });
    $('#saveBtn').disabled = false;
    form.querySelectorAll('.err').forEach(e => e.remove());
    if (res.status === 200 || res.status === 201) {
      $('#dlg').close();
      state.refCache = {};
      toast(res.json?.message || 'Saved');
      loadList();
      return;
    }
    $('#formErr').innerHTML = `<div class="banner bad">${esc(apiError(res))}</div>`;
    for (const [name, msgs] of Object.entries(res.json?.errors || {})) {
      const holder = form.querySelector(`[data-field="${name.split('.')[0]}"]`);
      if (holder) holder.insertAdjacentHTML('beforeend', `<div class="err">${esc(msgs.join(' '))}</div>`);
    }
  };
}

async function deleteRecord(r, row) {
  if (!confirm(`Delete ${r.label} #${row.id}? It is soft-deleted on the server.`)) return;
  const res = await api('DELETE', `/finance/${r.key}/${row.id}/delete`);
  if (res.status === 200) { toast(res.json?.message || 'Deleted'); state.refCache = {}; loadList(); }
  else toast(apiError(res), true);
}

async function postTransaction(row) {
  openDialog(`Post transaction #${row.id}`,
    `<p>Approves and posts this ${esc(row.type)} of ${esc(row.amount)} ${esc(row.currency?.code ?? '')}. A posted entry can no longer be edited or deleted, only reversed.</p>
     <div class="field"><label>Review notes</label><textarea id="postNotes"></textarea></div>
     <div class="endpoint">POST <code>/finance/transactions/${row.id}/post</code></div>
     <div id="postErr"></div>`,
    `<button data-close>Cancel</button><button class="primary" id="postBtn">Post</button>`);
  $('#postBtn').onclick = async () => {
    const res = await api('POST', `/finance/transactions/${row.id}/post`, { body: { review_notes: $('#postNotes').value || null } });
    if (res.status === 200) { $('#dlg').close(); toast(res.json.message); loadList(); }
    else $('#postErr').innerHTML = `<div class="banner bad">${esc(apiError(res))}</div>`;
  };
}

function showBatchEntries(batch) {
  state.current = RESOURCES.find(r => r.key === 'transactions');
  state.filters = { posting_batch_id: String(batch.id) };
  state.page = 1;
  location.hash = 'transactions';
}

// "2026-11-25T10:00:00+05:00" -> "25 Nov 10:00"
function pkt(iso) {
  if (!iso) return '';
  const [d, t] = iso.split('T');
  const [, m, day] = d.split('-');
  return `${Number(day)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m) - 1]} ${t.slice(0, 5)}`;
}

async function reverseTransaction(row) {
  openDialog(`Reverse transaction #${row.id}`,
    `<p>Creates the opposite entry (${row.type === 'credit' ? 'debit' : 'credit'} ${esc(row.amount)}) as a new draft in the current open batch. The original stays posted.</p>
     <div class="field"><label>Date of the reversal</label><input type="date" id="revDate" value="${today()}"><div class="hint">Can’t be before the bank account’s opening date.</div></div>
     <div id="revErr"></div>`,
    `<button data-close>Cancel</button><button class="primary" id="revBtn">Reverse</button>`);
  $('#revBtn').onclick = async () => {
    const res = await api('POST', `/finance/transactions/${row.id}/reverse`, { body: { transaction_date: $('#revDate').value || null } });
    if (res.status === 201) { $('#dlg').close(); toast(res.json.message); loadList(); }
    else $('#revErr').innerHTML = `<div class="banner bad">${esc(apiError(res))}</div>`;
  };
}

/* ---------- boot ---------- */
$('#baseUrl').value = state.base;
$('#baseUrl').addEventListener('change', e => { state.base = e.target.value.trim(); store.set('fm.base', state.base); state.refCache = {}; render(); });
$('#logoutBtn').onclick = async () => { await api('POST', '/logout'); setSession(null, null); render(); };
$('#clearLog').onclick = () => { $('#log').innerHTML = ''; };
$('#logToggle').onclick = () => $('#aside').classList.toggle('open');
window.addEventListener('hashchange', render);
render();
</script>
