<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance API Tester</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677083; --line: #e2e5ea;
  --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a46; --warn: #a15c00; --bad: #b42318;
  --ok-bg: #e7f5ec; --warn-bg: #fff4e0; --bad-bg: #fdecea; --code: #f1f3f6; --hover: #f2f5fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #98a1b3; --line: #2c323c;
    --accent: #6d8ff0; --accent-text: #0e1220; --ok: #5cc98a; --warn: #f0b45a; --bad: #f28b82;
    --ok-bg: #173324; --warn-bg: #3a2c12; --bad-bg: #3b1d1b; --code: #232833; --hover: #222833;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
select[multiple] { min-height: 110px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
button.small { padding: 2px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
code, pre { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; max-height: 360px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
header .base { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 260px; max-width: 420px; }
header .base label { color: var(--muted); white-space: nowrap; }
header .who { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; height: calc(100vh - 53px); }
nav { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 0; }
nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 16px 4px; }
nav a { display: block; padding: 5px 16px; color: inherit; text-decoration: none; border-left: 3px solid transparent; }
nav a:hover { background: var(--hover); }
nav a.active { border-left-color: var(--accent); background: var(--hover); font-weight: 600; }
main { overflow: auto; padding: 16px 20px 40px; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }

.titlebar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.titlebar h2 { margin: 0; font-size: 18px; }
.titlebar .grow { flex: 1; }
.endpoint { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.filters .f { display: flex; flex-direction: column; gap: 2px; min-width: 140px; flex: 0 1 180px; }
.filters .f label { font-size: 12px; color: var(--muted); }
.totals { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.totals b { color: var(--text); }

table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--hover); }
tr:last-child td { border-bottom: 0; }
td.actions { white-space: nowrap; text-align: right; }
td.actions button { margin-left: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; background: var(--code); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
.kpi small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.kpi b { font-size: 18px; font-variant-numeric: tabular-nums; }
.summary { overflow-x: auto; }
.summary table { min-width: 860px; font-size: 13px; }
.summary tr.section td { background: var(--hover); font-weight: 700; }
.summary tr.subtotal td { font-weight: 600; }
.summary tr.subtotal.usd td { color: var(--accent); }
.summary tr.grand td { background: var(--text); color: var(--bg); font-weight: 700; }
.summary td.neg { color: var(--bad); }
.summary .rate { color: var(--muted); font-weight: 400; font-size: 12px; }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); }

aside .loghead { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
aside .loghead b { font-size: 13px; }
.log { padding: 4px 0; }
.log details { border-bottom: 1px solid var(--line); padding: 6px 12px; }
.log summary { cursor: pointer; display: flex; gap: 6px; align-items: baseline; list-style: none; }
.log summary::-webkit-details-marker { display: none; }
.log .m { font-weight: 700; font-size: 11px; width: 46px; }
.log .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.log .t { color: var(--muted); font-size: 11px; }
.log h4 { margin: 8px 0 0; font-size: 11px; color: var(--muted); text-transform: uppercase; }

dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--panel); color: var(--text); width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
dialog .dh h3 { margin: 0; font-size: 16px; }
dialog .db { padding: 14px 16px; overflow: auto; max-height: calc(100vh - 170px); }
dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.field label .req { color: var(--bad); }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.field .err { font-size: 12px; color: var(--bad); margin-top: 3px; }
.field.check label { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; }
.field.check input { width: auto; }
.banner { padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; background: var(--code); color: var(--muted); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.sheetwrap { overflow-x: auto; }
.sheet { min-width: 1180px; font-size: 13px; }
.sheet td { padding: 2px 4px; vertical-align: middle; }
.sheet th { padding: 6px; }
.sheet input, .sheet select { padding: 3px 5px; border-radius: 4px; border-color: transparent; background: transparent; }
.sheet input:focus, .sheet select:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.sheet #shRows tr:hover input, .sheet #shRows tr:hover select { border-color: var(--line); }
.sheet input.num { text-align: right; }
.sheet .bad { border-color: var(--bad) !important; background: var(--bad-bg); }
.sheet tr.rowerr td { background: var(--bad-bg); }
.sheet tr.errline td { color: var(--bad); font-size: 12px; padding: 0 6px 4px; }
.sheet tr.existing td { color: var(--muted); padding: 5px 6px; }
.sheet tr.existing.draft td { background: var(--warn-bg); }
.sheet tr.carried td, .sheet tfoot td { font-weight: 700; background: var(--hover); padding: 6px; }
.sheet .neg { color: var(--bad); }
.sheet .bal { color: var(--muted); padding-right: 8px; }
.sheet .rn { color: var(--muted); }
.sheet .cellnote { color: var(--warn); font-size: 11px; padding: 0 5px; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 10; }
#toast div { padding: 8px 14px; border-radius: 6px; background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 560px; }
#toast div.bad { background: var(--bad); color: #fff; }

.login { max-width: 380px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.login h2 { margin: 0 0 4px; font-size: 18px; }
.login p { color: var(--muted); margin: 0 0 16px; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 200px minmax(0, 1fr); }
  aside { display: none; }
  aside.open { display: flex; position: fixed; right: 0; top: 53px; bottom: 0; width: min(420px, 100vw); z-index: 5; box-shadow: -4px 0 16px rgba(0,0,0,.15); }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 12px 16px 40px; }
  table { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Finance API Tester</h1>
  <div class="base">
    <label for="baseUrl">API</label>
    <input id="baseUrl" spellcheck="false">
  </div>
  <div class="who">
    <span id="whoName"></span>
    <button id="logToggle" class="small">Request log</button>
    <button id="logoutBtn" class="small" hidden>Log out</button>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="aside">
    <div class="loghead"><b>Request log</b><button class="small" id="clearLog">Clear</button></div>
    <div class="log" id="log"></div>
  </aside>
</div>

<dialog id="dlg">
  <div class="dh"><h3 id="dlgTitle"></h3><button class="small" data-close>Close</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df" id="dlgFoot"></div>
</dialog>

<div id="toast"></div>

<script>
'use strict';

/* ---------- storage (best effort; page still works without it) ---------- */
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const state = {
  base: store.get('fm.base', 'http://crm-portal.test/api/v2'),
  token: store.get('fm.token'),
  user: JSON.parse(store.get('fm.user', 'null')),
  current: null,
  page: 1,
  perPage: 15,
  filters: {},
  refCache: {},
};

/* ---------- resource definitions ---------- */
const yesNo = [{ value: '1', label: 'Active' }, { value: '0', label: 'Inactive' }];
const active = r => r.is_active ? pill('active', 'ok') : pill('inactive');
// The fixed reports (FmReport::TYPES on the API).
const reportTypes = [
  { value: 'daily_bank_report', label: 'Daily Bank Report' },
  { value: 'daily_recon', label: 'Daily Recon' },
  { value: 'statement_report', label: 'Statement Report' },
];
const reportName = key => reportTypes.find(t => t.value === key)?.label || key;

const refLabel = {
  companies: r => r.name + (r.short_code ? ` (${r.short_code})` : ''),
  banks: r => r.name,
  currencies: r => `${r.code} — ${r.title}`,
  'bank-accounts': r => `${r.title} (${r.account_number})`,
  'chart-account-groups': r => r.name,
  'chart-accounts': r => `${r.acc_code} — ${r.name}`,
  'report-categories': r => `${reportName(r.report_type)} › ${r.name}`,
  reports: r => `#${r.id} ${r.report_type}${r.bank_account ? ' · ' + r.bank_account.title : ''}`,
};

const RESOURCES = [
  { group: 'Setup', key: 'currencies', label: 'Currencies',
    fields: [
      { name: 'title', required: true },
      { name: 'code', required: true, hint: 'Saved in upper case. Unique, even across deleted currencies.' },
      { name: 'symbol' },
    ],
    filters: [{ name: 'search' }],
    columns: [
      ['Code', r => r.code], ['Title', r => r.title], ['Symbol', r => r.symbol],
      ['Latest rate → USD', r => r.latest_exchange_rate ? `${r.latest_exchange_rate.rate_to_usd} (${r.latest_exchange_rate.effective_date})` : '—'],
    ] },
  { group: 'Setup', key: 'exchange-rates', label: 'Exchange Rates',
    fields: [
      { name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies', required: true },
      { name: 'rate_to_usd', label: 'Rate to USD', type: 'number', step: 'any', required: true, hint: 'e.g. PKR → USD is about 0.0035778175' },
      { name: 'effective_date', type: 'date', required: true },
    ],
    filters: [{ name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies' }, { name: 'from_date', type: 'date' }, { name: 'to_date', type: 'date' }],
    columns: [['Currency', r => r.currency?.code], ['Rate to USD', r => r.rate_to_usd, 'num'], ['Effective', r => r.effective_date]] },
  { group: 'Setup', key: 'companies', label: 'Companies',
    fields: [
      { name: 'name', required: true }, { name: 'short_code' }, { name: 'note', type: 'textarea' },
      { name: 'is_active', label: 'Active', type: 'bool', default: true },
      { name: 'bank_account_ids', label: 'Bank accounts', type: 'multiref', ref: 'bank-accounts', from: 'bank_accounts', hint: 'Replaces the current links when saved.' },
    ],
    filters: [{ name: 'search' }, { name: 'is_active', label: 'Status', type: 'select', options: yesNo }],
    columns: [['Name', r => r.name], ['Code', r => r.short_code], ['Bank accounts', r => r.bank_accounts_count, 'num'], ['Status', active]] },
  { group: 'Setup', key: 'banks', label: 'Banks',
    fields: [{ name: 'name', required: true }, { name: 'short_code' }, { name: 'is_active', label: 'Active', type: 'bool', default: true }],
    filters: [{ name: 'search' }, { name: 'is_active', label: 'Status', type: 'select', options: yesNo }],
    columns: [['Name', r => r.name], ['Code', r => r.short_code], ['Accounts', r => r.bank_accounts_count, 'num'], ['Status', active]] },
  { group: 'Setup', key: 'bank-accounts', label: 'Bank Accounts',
    fields: [
      { name: 'bank_id', label: 'Bank', type: 'ref', ref: 'banks', required: true },
      { name: 'title', required: true }, { name: 'account_number', required: true },
      { name: 'opening_date', type: 'date', hint: 'Entries cannot be dated before this.' },
      { name: 'opening_balance', type: 'number', step: '0.01' },
      { name: 'region' }, { name: 'note', type: 'textarea' },
      { name: 'is_active', label: 'Active', type: 'bool', default: true },
      { name: 'currency_ids', label: 'Currencies', type: 'multiref', ref: 'currencies', from: 'currencies', hint: 'Transactions can only use these currencies.' },
      { name: 'company_ids', label: 'Companies', type: 'multiref', ref: 'companies', from: 'companies', required: true, hint: 'At least one.' },
      { name: 'report_category_ids', label: 'Report categories', type: 'multiref', ref: 'report-categories', from: 'report_categories', hint: 'One per report, e.g. Daily Bank Report › Wallets. Leaving a report out takes the account off it.' },
    ],
    filters: [
      { name: 'search' }, { name: 'bank_id', label: 'Bank', type: 'ref', ref: 'banks' },
      { name: 'report_category_id', label: 'Report category', type: 'ref', ref: 'report-categories' },
      { name: 'company_id', label: 'Company', type: 'ref', ref: 'companies' },
      { name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies' },
      { name: 'is_active', label: 'Status', type: 'select', options: yesNo },
    ],
    columns: [
      ['Title', r => r.title], ['Number', r => r.account_number], ['Bank', r => r.bank?.name],
      ['Currencies', r => (r.currencies || []).map(c => c.code).join(', ')],
      ['Companies', r => (r.companies || []).map(c => c.name).join(', ')],
      ['Reports', r => (r.report_categories || []).map(c => `${c.report_name} › ${c.name}`).join(', ')],
      ['Opening', r => `${r.opening_balance ?? ''} ${r.opening_date ? '@ ' + r.opening_date : ''}`],
      ['Status', active],
    ] },
  { group: 'Setup', key: 'bank-account-currencies', label: 'Bank Account ↔ Currency',
    fields: [
      { name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts', required: true },
      { name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies', required: true },
    ],
    filters: [{ name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts' }, { name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies' }],
    columns: [['Bank account', r => r.bank_account?.title], ['Bank', r => r.bank_account?.bank?.name], ['Currency', r => r.currency?.code]] },
  { group: 'Setup', key: 'company-bank-accounts', label: 'Company ↔ Bank Account',
    fields: [
      { name: 'company_id', label: 'Company', type: 'ref', ref: 'companies', required: true },
      { name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts', required: true },
    ],
    filters: [{ name: 'company_id', label: 'Company', type: 'ref', ref: 'companies' }, { name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts' }],
    columns: [['Company', r => r.company?.name], ['Bank account', r => r.bank_account?.title], ['Bank', r => r.bank_account?.bank?.name]] },
  { group: 'Chart of accounts', key: 'chart-account-groups', label: 'Account Groups',
    fields: [{ name: 'name', required: true }, { name: 'recon_label' }, { name: 'is_active', label: 'Active', type: 'bool', default: true }],
    filters: [{ name: 'search' }, { name: 'is_active', label: 'Status', type: 'select', options: yesNo }],
    columns: [['Name', r => r.name], ['Recon label', r => r.recon_label], ['Accounts', r => r.chart_accounts_count, 'num'], ['Status', active]] },
  { group: 'Chart of accounts', key: 'chart-accounts', label: 'Chart Accounts',
    fields: [
      { name: 'name', required: true },
      { name: 'chart_account_group_id', label: 'Group', type: 'ref', ref: 'chart-account-groups', required: true },
      { name: 'type_code', required: true, hint: 'Free text for now, e.g. income, expense, asset.' },
      { name: 'acc_code', label: 'Account code', required: true },
      { name: 'is_active', label: 'Active', type: 'bool', default: true },
    ],
    filters: [{ name: 'search' }, { name: 'chart_account_group_id', label: 'Group', type: 'ref', ref: 'chart-account-groups' }, { name: 'type_code' }, { name: 'is_active', label: 'Status', type: 'select', options: yesNo }],
    columns: [['Code', r => r.acc_code], ['Name', r => r.name], ['Group', r => r.group?.name], ['Type', r => r.type_code], ['Status', active]] },
  { group: 'Books', key: 'transactions', label: 'Transactions',
    editWhen: r => r.status === 'draft', deleteWhen: r => r.status === 'draft',
    fields: [
      { name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts', required: true, createOnly: true, hint: 'Fixed once saved: the entry joins this account’s batch for the current business day.' },
      { name: 'chart_account_id', label: 'Chart account', type: 'ref', ref: 'chart-accounts', required: true },
      { name: 'currency_id', label: 'Currency', type: 'ref', ref: 'currencies', required: true, hint: 'Must be linked to the bank account.' },
      { name: 'transaction_date', type: 'date', required: true, default: () => today() },
      { name: 'type', type: 'select', options: [{ value: 'credit', label: 'Credit (money in)' }, { value: 'debit', label: 'Debit (money out)' }], required: true },
      { name: 'amount', type: 'number', step: '0.01', required: true },
      { name: 'description', type: 'textarea' }, { name: 'reference' },
    ],
    filters: [
      { name: 'search' }, { name: 'bank_account_id', label: 'Bank account', type: 'ref', ref: 'bank-accounts' },
      { name: 'company_id', label: 'Company', type: 'ref', ref: 'companies' },
      { name: 'chart_account_id', label: 'Chart account', type: 'ref', ref: 'chart-accounts' },
      { name: 'status', type: 'select', options: [{ value: 'draft', label: 'Draft' }, { value: 'posted', label: 'Posted' }] },
      { name: 'type', type: 'select', options: [{ value: 'credit', label: 'Credit' }, { value: 'debit', label: 'Debit' }] },
      { name: 'from_date', type: 'date' }, { name: 'to_date', type: 'date' },
      { name: 'posting_batch_id', label: 'Batch ID' },
    ],
    withTotals: true,
    columns: [
      ['Date', r => r.transaction_date], ['Bank account', r => r.bank_account?.title],
      ['Chart account', r => r.chart_account ? `${r.chart_account.acc_code} ${r.chart_account.name}` : ''],
      ['Type', r => pill(r.type, r.type === 'credit' ? 'ok' : 'warn')],
      ['Amount', r => `${r.amount} ${r.currency?.code ?? ''}`, 'num'],
      ['Status', r => pill(r.status, r.status === 'posted' ? 'ok' : '')],
      ['Batch', r => r.posting_batch ? `#${r.posting_batch.id} · ${r.posting_batch.batch_date}` : ''],
      ['Approved by', r => r.approved_by?.name],
      ['Description', r => r.description],
    ],
    extraActions: [
      { label: 'Post', when: r => r.status === 'draft', run: r => postTransaction(r) },
      { label: 'Reverse', when: r => r.status === 'posted', run: r => reverseTransaction(r) },
    ] },
  { group: 'Books', key: 'transactions-bulk', label: 'Bank Entry Sheet (bulk)', view: () => renderBulkTransactions() },

/* ---------- API + request log ---------- */
async function api(method, path, { body, query } = {}) {
  const qs = query ? '?' + new URLSearchParams(Object.entries(query).filter(([, v]) => v !== '' && v !== null && v !== undefined)).toString() : '';
  const url = state.base.replace(/\/+$/, '') + path + (qs === '?' ? '' : qs);
  const headers = { Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (state.token) headers.Authorization = 'Bearer ' + state.token;

  const started = performance.now();
  let status = 0, json = null, text = '';
  try {
    const res = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    status = res.status;
    text = await res.text();
    try { json = JSON.parse(text); } catch { json = null; }
  } catch (e) {
    text = 'Network error: ' + e.message + '\n\nIs the API URL right, and is Herd running?';
  }
  logRequest({ method, url, status, ms: Math.round(performance.now() - started), body, response: json ?? text });

  if (status === 401 && path !== '/login') {
    setSession(null, null);
    toast('Session expired or not logged in. Please log in again.', true);
    render();
  }
  if (status === 429) toast('Rate limit hit (60 requests/minute). Wait a moment and try again.', true);
  return { status, json, text };
}

function logRequest(e) {
  const kind = e.status >= 200 && e.status < 300 ? 'ok' : e.status === 422 ? 'warn' : 'bad';
  const d = document.createElement('details');
  const time = new Date().toLocaleTimeString();
  const short = e.url.replace(state.base.replace(/\/+$/, ''), '');
  d.innerHTML = `<summary><span class="m">${esc(e.method)}</span><span class="u" title="${esc(e.url)}">${esc(short)}</span>`
    + `<span class="pill ${kind}">${e.status || 'ERR'}</span><span class="t">${e.ms}ms · ${time}</span></summary>`
    + (e.body !== undefined ? `<h4>Request body</h4><pre>${esc(JSON.stringify(e.body, null, 2))}</pre>` : '')
    + `<h4>Response</h4><pre>${esc(typeof e.response === 'string' ? e.response : JSON.stringify(e.response, null, 2))}</pre>`;
  $('#log').prepend(d);
  while ($('#log').children.length > 60) $('#log').lastChild.remove();
}

function apiError(res) {
  if (res.json?.message) return res.json.message + (res.json.error ? ` (${res.json.error})` : '');
  return `Request failed (${res.status || 'network error'})`;
}

function money(v) {

  if (Math.abs(v) < 0.005) return '-';
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return v < 0 ? `(${s})` : s;
}
const moneyTd = v => `<td class="num${v < 0 ? ' neg' : ''}">${esc(money(v))}</td>`;

/* ---------- bulk transactions: bank entry sheet ---------- */
// One sheet per bank account (and currency). Rows: Date, Description, Group, Account, Reference, Debit | Credit.
// Debit = money out, Credit = money in; a row takes one or the other. Paste straight from Excel, or import .xlsx/.csv.
const SHEET_COLS = ['date', 'description', 'group', 'account', 'reference', 'debit', 'credit'];
const sheet = { accountId: null, currencyId: null, rows: [], dateOrder: 'dmy', ctx: null, result: '' };
const blankRow = () => ({ date: '', description: '', groupId: '', accountId: '', reference: '', debit: '', credit: '', note: '', errors: {} });
const rowIsEmpty = r => !r.date && !r.description && !r.accountId && !r.reference && !r.debit && !r.credit && !r.note;
const toNum = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const fmt2 = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const bankAccLabel = a => `${(a.companies || []).map(c => c.name).join(', ') || 'No company'} — ${a.title}${a.account_number ? ` (${a.account_number})` : ''}`;
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');

// "03-Nov-26", "2026-11-03", "3/11/2026", Excel serial 46329, Date objects -> "2026-11-03" (or '' when unreadable).
function parseSheetDate(v, order = sheet.dateOrder) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  const s = String(v).trim();
  if (/^\d{4,5}(\.\d+)?$/.test(s) && +s > 20000 && +s < 80000) { // Excel serial day
    const d = new Date(Math.round((+s - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  const yr = y => (y.length === 2 ? 2000 + +y : +y);
  const ok = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${y}-${pad(m)}-${pad(d)}` : '');
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  if ((m = s.match(/^(\d{1,2})[-\s/.]([a-z]{3})[a-z]*[-\s/.,]+(\d{2,4})$/i))) return ok(yr(m[3]), months.indexOf(m[2].toLowerCase()) + 1, +m[1]);
  if ((m = s.match(/^([a-z]{3})[a-z]*[-\s/.]+(\d{1,2}),?[-\s/.]+(\d{2,4})$/i))) return ok(yr(m[3]), months.indexOf(m[1].toLowerCase()) + 1, +m[2]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) {
    const [a, b] = [+m[1], +m[2]];
    return order === 'mdy' ? ok(yr(m[3]), a, b) : ok(yr(m[3]), b, a);
  }
  return '';
}

// "1,234.50", "$ 500", "(391.00)", "-25" -> number ('' when blank or unreadable).
function parseSheetAmount(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (!s || s === '-') return '';
  const neg = /^\(.*\)$/.test(s) || s.startsWith('-');
  s = s.replace(/[^0-9.]/g, '');
  if (!s || isNaN(+s)) return NaN;
  return neg ? -(+s) : +s;
}

function sheetLookups(groups, charts) {
  const byGroup = {};
  for (const c of charts) (byGroup[c.chart_account_group_id ?? c.group?.id ?? ''] ||= []).push(c);
  const findGroup = text => {
    const t = norm(text);
    if (!t) return null;
    return groups.find(g => norm(g.name) === t || norm(g.recon_label) === t) || null;
  };
  const findAccount = (text, groupId) => {
    const t = norm(text);
    if (!t) return null;
    const pool = groupId ? charts.filter(c => String(c.chart_account_group_id ?? c.group?.id) === String(groupId)) : charts;
    const tests = [
      c => norm(c.acc_code) === t,
      c => norm(`${c.acc_code} ${c.name}`) === t || norm(`${c.acc_code} — ${c.name}`) === t || norm(`${c.acc_code} - ${c.name}`) === t,
      c => norm(c.name) === t,
      c => t.startsWith(norm(c.acc_code) + ' '),
    ];
    for (const test of tests) {
      const hit = pool.filter(test);
      if (hit.length === 1) return hit[0];
      if (hit.length > 1) return null; // ambiguous: let the user pick
    }
    return groupId ? findAccount(text, null) : null;
  };
  return { byGroup, findGroup, findAccount };
}

      ${msgs.length ? `<tr class="errline"><td></td><td colspan="9">${msgs.map(esc).join(' · ')}</td></tr>` : ''}`;
  };
  const drawRows = (focus) => {
    $('#shRows').innerHTML = sheet.rows.map(rowHtml).join('');
    recalc();
    if (focus) $(`#shRows tr[data-i="${focus.i}"] [data-k="${focus.k}"]`)?.focus();
  };
  const startBalance = () => sheet.ctx ? sheet.ctx.closing_balance : 0;
  const recalc = () => {
    let bal = startBalance(), dr = 0, cr = 0, n = 0;
    sheet.rows.forEach((r, i) => {
      const d = toNum(r.debit), c = toNum(r.credit);
      const cellEl = $(`#shRows tr[data-i="${i}"] .bal`);
      if (!d && !c) { if (cellEl) cellEl.textContent = ''; return; }
      n++; dr += d; cr += c; bal += c - d;
      if (cellEl) { cellEl.textContent = money(bal); cellEl.classList.toggle('neg', bal < 0); }
    });
    $('#shDebit').textContent = fmt2(dr);
    $('#shCredit').textContent = fmt2(cr);
    $('#shClosing').innerHTML = `<b class="${bal < 0 ? 'neg' : ''}">${esc(money(bal))}</b>`;
    $('#shCount').textContent = n ? `(${n} row${n === 1 ? '' : 's'})` : '';
    $('#shJson').textContent = JSON.stringify({ transactions: buildPayload().payload }, null, 2);
  };

  const tbody = $('#shRows');
  tbody.addEventListener('input', ev => {
    const el = ev.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.k) return;
    const r = sheet.rows[+tr.dataset.i], k = el.dataset.k;
    r[k] = el.value;
    // A row is either a debit or a credit: typing in one empties the other.
    if (k === 'debit' && el.value !== '') { r.credit = ''; tr.querySelector('[data-k="credit"]').value = ''; }
    if (k === 'credit' && el.value !== '') { r.debit = ''; tr.querySelector('[data-k="debit"]').value = ''; }
    recalc();
  });
  tbody.addEventListener('change', ev => {
    const el = ev.target, tr = el.closest('tr[data-i]'); if (!tr) return;
    const r = sheet.rows[+tr.dataset.i];
    if (el.dataset.k === 'groupId') {
      if (r.accountId && String(chartById[r.accountId]?.chart_account_group_id ?? chartById[r.accountId]?.group?.id) !== String(r.groupId)) r.accountId = '';
      tr.querySelector('[data-k="accountId"]').innerHTML = accountOpts(r.groupId, r.accountId);
    }
    if (el.dataset.k === 'accountId' && r.accountId) {
      const c = chartById[r.accountId];
      r.groupId = String(c?.chart_account_group_id ?? c?.group?.id ?? '');
      r.note = '';
      tr.querySelector('[data-k="groupId"]').value = r.groupId;
      tr.querySelector('[data-k="accountId"]').innerHTML = accountOpts(r.groupId, r.accountId);
      tr.querySelector('.cellnote')?.remove();
    }
    if (el.dataset.k === 'debit' || el.dataset.k === 'credit') {
      const v = parseSheetAmount(el.value);
      if (typeof v === 'number' && !isNaN(v)) { r[el.dataset.k] = String(Math.abs(v)); el.value = r[el.dataset.k]; }
      recalc();
    }
  });
  tbody.addEventListener('click', ev => {
    const b = ev.target.closest('[data-del]'); if (!b) return;
    sheet.rows.splice(+b.closest('tr').dataset.i, 1);
    if (!sheet.rows.length) sheet.rows.push(blankRow());

  });
  tbody.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.target.tagName === 'BUTTON') return;
    ev.preventDefault();
    const tr = ev.target.closest('tr[data-i]'), i = +tr.dataset.i;

    else $(`#shRows tr[data-i="${i + 1}"] [data-k="date"]`)?.focus();
  });
  // Paste a block from Excel: fills across and down from the focused cell, adding rows as needed.
  tbody.addEventListener('paste', ev => {
    const text = ev.clipboardData?.getData('text/plain') || '';

  });

  /* ----- import (paste or file) ----- */
  const HEAD = {
    date: ['date', 'transaction date', 'txn date', 'value date', 'posting date'],
    description: ['description', 'details', 'narration', 'particulars', 'memo'],
    group: ['group', 'account group', 'chart group', 'category'],
    account: ['account', 'chart account', 'chart of account', 'gl account', 'account code', 'code'],
    reference: ['reference', 'ref', 'ref #', 'ref no', 'cheque no', 'check no'],
    debit: ['debit', 'dr', 'withdrawal', 'money out', 'out', 'debit (out)'],
    credit: ['credit', 'cr', 'deposit', 'money in', 'in', 'credit (in)'],
    amount: ['amount'], type: ['type', 'dr/cr'],
  };
  const headerMap = row => {
    const map = {};
    row.forEach((h, idx) => { const t = norm(h).replace(/[:*]/g, ''); for (const [k, names] of Object.entries(HEAD)) if (!(k in map) && names.includes(t)) map[k] = idx; });
    return 'date' in map && ('debit' in map || 'credit' in map || 'amount' in map) ? map : null;
  };
  function importGrid(grid, { at = null, col = 0 } = {}) {
    grid = grid.filter(r => r.some(v => String(v ?? '').trim() !== ''));
    if (!grid.length) return toast('Nothing to import.', true);
    let map = null, start = 0;
    for (let i = 0; i < Math.min(grid.length, 10); i++) if ((map = headerMap(grid[i]))) { start = i + 1; break; }
    if (!map) { // no header row: columns in sheet order, from the focused column
      map = {}; SHEET_COLS.slice(col).forEach((k, j) => { map[k] = j; });
    } else col = 0;
    const get = (row, k) => (k in map ? row[map[k]] : undefined);
    const rows = grid.slice(start).map(src => {
      const r = blankRow(), notes = [];
      r.date = parseSheetDate(get(src, 'date'));
      if (get(src, 'date') !== undefined && String(get(src, 'date')).trim() && !r.date) notes.push(`date “${get(src, 'date')}” not understood`);
      r.description = String(get(src, 'description') ?? '').trim();
      r.reference = String(get(src, 'reference') ?? '').trim();
      const gText = String(get(src, 'group') ?? '').trim(), aText = String(get(src, 'account') ?? '').trim();
      const g = L.findGroup(gText);
      if (g) r.groupId = String(g.id); else if (gText) notes.push(`group “${gText}” not found`);
      const a = L.findAccount(aText, r.groupId);
      if (a) { r.accountId = String(a.id); r.groupId = String(a.chart_account_group_id ?? a.group?.id ?? r.groupId); }
      else if (aText) notes.push(`account “${aText}” not found or ambiguous`);
      let d = parseSheetAmount(get(src, 'debit')), c = parseSheetAmount(get(src, 'credit'));
      if ('amount' in map && d === '' && c === '') {
        const amt = parseSheetAmount(get(src, 'amount')), t = norm(get(src, 'type'));
        if (typeof amt === 'number') (t.startsWith('d') || (!t && amt < 0) ? (d = Math.abs(amt)) : (c = Math.abs(amt)));
      }
      if (typeof d === 'number' && d < 0) { c = c === '' ? -d : c; d = ''; } // a negative debit is money in
      if (typeof c === 'number' && c < 0) { d = d === '' ? -c : d; c = ''; }
      if (Number.isNaN(d) || Number.isNaN(c)) notes.push('amount not understood');
      r.debit = typeof d === 'number' && !isNaN(d) && d ? String(d) : '';
      r.credit = typeof c === 'number' && !isNaN(c) && c ? String(c) : '';
      if (r.debit && r.credit) notes.push('has both debit and credit — keep one');
      r.note = notes.join('; ');
      return r;
    });
    if (at === null) { // file import: append after the last non-empty row
      const keep = sheet.rows.filter(r => !rowIsEmpty(r));
      sheet.rows = keep.concat(rows);
    } else if (col > 0 && !start) { // pasted into the middle of a row: merge into existing rows
      rows.forEach((r, j) => {
        const cur = sheet.rows[at + j] || (sheet.rows[at + j] = blankRow());
        for (const k of SHEET_COLS.slice(col)) {
          const key = k === 'group' ? 'groupId' : k === 'account' ? 'accountId' : k;
          if (k in map && r[key] !== '') cur[key] = r[key];
          if (k === 'account' && r.groupId) cur.groupId = r.groupId;
        }
        if (cur.debit && cur.credit) cur.note = 'has both debit and credit — keep one';
        if (r.note) cur.note = r.note;
      });
    } else {
      sheet.rows.splice(at, rows.length, ...rows);
    }
    if (sheet.rows.length > 500) toast(`The API takes 500 rows per save; you have ${sheet.rows.length}.`, true);
    const flagged = rows.filter(r => r.note).length;
    toast(`Imported ${rows.length} row${rows.length === 1 ? '' : 's'}${flagged ? ` · ${flagged} need a look` : ''}`, !!flagged);
    drawRows();
  }

  $('#shFile').onchange = async ev => {
    const file = ev.target.files[0]; if (!file) return;

  $('#shTemplate').onclick = () => {

  $('#shAdd').onclick = () => { sheet.rows.push(blankRow()); drawRows({ i: sheet.rows.length - 1, k: 'date' }); };
  $('#shAdd10').onclick = () => { for (let i = 0; i < 10; i++) sheet.rows.push(blankRow()); drawRows(); };
  $('#shClearEmpty').onclick = () => { sheet.rows = sheet.rows.filter(r => !rowIsEmpty(r)); if (!sheet.rows.length) sheet.rows.push(blankRow()); drawRows(); };
  $('#shClearAll').onclick = () => { if (!confirm('Remove all unsaved rows from the sheet?')) return; sheet.rows = Array.from({ length: 5 }, blankRow); sheet.result = ''; $('#shOut').innerHTML = ''; drawRows(); };

  /* ----- save ----- */
  function buildPayload() {
    const payload = [], index = [];
    sheet.rows.forEach((r, i) => {
      if (rowIsEmpty(r)) return;
      const d = toNum(r.debit), c = toNum(r.credit);
      payload.push({
        bank_account_id: +sheet.accountId, currency_id: +sheet.currencyId,
        chart_account_id: r.accountId ? +r.accountId : null,
        transaction_date: r.date || null,
        type: c && !d ? 'credit' : 'debit', amount: c && !d ? c : d,
        description: r.description || null, reference: r.reference || null,
      });
      index.push(i);
    });
    return { payload, index };
  }
  function checkRows() {
    let count = 0;
    const opening = acc.opening_date;
    sheet.rows.forEach(r => {
      r.errors = {};
      if (rowIsEmpty(r)) return;
      if (!r.date) r.errors.date = 'Date is required';
      else if (opening && r.date < opening) r.errors.date = `Date is before the opening date ${opening}`;
      if (!r.accountId) r.errors.account = r.note || 'Account is required';
      const d = toNum(r.debit), c = toNum(r.credit);
      if (d && c) r.errors.amount = 'Enter either a debit or a credit, not both';
      else if (!(d > 0) && !(c > 0)) r.errors.amount = 'Enter a debit or a credit amount above 0';

  }
  $('#shSave').onclick = async () => {
    const bad = checkRows();

    if (!payload.length) { drawRows(); return toast('The sheet has no entries to save.', true); }
    if (bad) { drawRows(); $('#shErrors').innerHTML = `<div class="banner bad">${bad} row${bad === 1 ? '' : 's'} need${bad === 1 ? 's' : ''} fixing before saving (marked in red).</div>`; return; }
    if (payload.length > 500) return toast('The API takes at most 500 rows per save. Split the sheet.', true);
    $('#shErrors').innerHTML = '';

    $('#shSave').disabled = false;
    if (res.status === 201) {
      const made = [].concat(res.json.data);
      sheet.result = `<div class="banner" style="background:var(--ok-bg);color:var(--ok)">${esc(res.json.message || 'Saved')} — ${made.length} entr${made.length === 1 ? 'y' : 'ies'} saved as draft${made[0]?.posting_batch ? ` in batch #${made[0].posting_batch.id}` : ''}.</div>`;
      toast(res.json.message || 'Saved');

    }
    // Map "transactions.3.amount" / "transactions.3" back to the sheet row.
    const general = [];
    for (const [key, msgs] of Object.entries(res.json?.errors || {})) {
      const m = key.match(/^transactions\.(\d+)(?:\.(\w+))?$/);

    $('#shErrors').innerHTML = `<div class="banner bad">${esc(apiError(res))} — nothing was saved.${general.length ? `<ul style="margin:6px 0 0 18px">${general.map(g => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}</div>`;
  };

  drawRows();

  /* ----- current balance and recent entries ----- */
  if (!sheet.ctx) {

    const res = await api('GET', `/finance/statements/${acc.id}`, { query: { currency_id: sheet.currencyId, from_date: acc.opening_date && acc.opening_date > from ? acc.opening_date : from, to_date: '2099-12-31' } });
    if (state.current?.key !== 'transactions-bulk' || String(sheet.accountId) !== String(acc.id)) return;

  $('#shBadges').innerHTML = `<span class="pill">Currency: <b>${esc(currency?.code ?? '')}</b></span>
    <span class="pill">Opening: <b>${esc(fmt2(acc.opening_balance))}</b>${acc.opening_date ? ' on ' + esc(niceDate(acc.opening_date)) : ''}</span>
    <span class="pill ok">Current balance: <b>${esc(currency?.code ?? '')} ${esc(money(ctx.closing_balance))}</b></span>

  $('#shExisting').innerHTML = ctx.failed ? `<tr><td colspan="10"><div class="banner bad" style="margin:0">Could not load the current balance: ${esc(ctx.failed)}. Balances below start at 0.</div></td></tr>` : `
    ${hidden > 0 ? `<tr class="existing"><td></td><td colspan="7" class="endpoint">… ${hidden} earlier entr${hidden === 1 ? 'y' : 'ies'} (see Reports → Bank Statement)</td><td></td><td></td></tr>` : ''}
    ${recent.map(r => `<tr class="existing${r.status === 'draft' ? ' draft' : ''}">
      <td class="num" title="${r.status === 'draft' ? 'Draft — not yet posted' : 'Posted — final'}">${r.status === 'draft' ? '✎' : '🔒'}</td>
      <td>${esc(niceDate(r.transaction_date))}</td><td>${esc(r.description || '')}</td>
      <td class="endpoint">${esc(chartById[r.chart_account_id]?.group?.name || '')}</td>
      <td>${esc([r.chart_account_code, r.chart_account_name].filter(Boolean).join(' '))}</td><td>${esc(r.reference || '')}</td>
      <td class="num">${r.debit === null ? '' : esc(fmt2(r.debit))}</td><td class="num">${r.credit === null ? '' : esc(fmt2(r.credit))}</td>
      <td class="num">${esc(money(r.balance))}</td><td></td></tr>`).join('')}
    <tr class="carried"><td></td><td colspan="7" class="num">Balance carried forward</td><td class="num${ctx.closing_balance < 0 ? ' neg' : ''}">${esc(money(ctx.closing_balance))}</td><td></td></tr>`;
  recalc();
}

// Minimal CSV/TSV parser with quoted fields.
function parseDelimited(text, sep = ',') {
  const rows = []; let row = [], val = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { val += '"'; i++; } else q = false; } else val += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(val); val = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(val); rows.push(row); row = []; val = ''; }
    else val += ch;
  }
  if (val !== '' || row.length) { row.push(val); rows.push(row); }
  return rows;
}

// SheetJS, loaded only when an .xlsx/.xls file is imported.
let sheetJsPromise = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return sheetJsPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { sheetJsPromise = null; reject(new Error('could not load the Excel reader (offline?). Save the sheet as CSV and import that.')); };
    document.head.appendChild(s);
  });
}

/* ---------- bulk create: one grid screen per resource ---------- */
// Each create endpoint also takes many records: {"<key>": [{...}, ...]} or a bare JSON array, all saved or none.
const BULK_KEYS = {
  companies: 'companies', banks: 'banks', 'bank-accounts': 'bank_accounts', currencies: 'currencies',
  'exchange-rates': 'rates', 'chart-account-groups': 'groups', 'chart-accounts': 'accounts', transactions: 'transactions',
};
const bulkState = { dateOrder: 'dmy' };
const bulkOf = key => (bulkState[key] ||= { rows: [], bare: false, result: '' });

// Text from a sheet ("Synovatech Inc", "USD", "4123 VPN", "12") -> record id, or null.
function resolveRef(rows, refKey, text) {
  const t = norm(text);
  if (!t) return null;
  if (/^\d+$/.test(t)) { const byId = rows.find(r => String(r.id) === t); if (byId) return byId.id; }
  const tests = [
    r => norm(refLabel[refKey] ? refLabel[refKey](r) : '') === t,
    r => ['name', 'code', 'title', 'acc_code', 'account_number', 'short_code'].some(k => r[k] !== undefined && r[k] !== null && norm(r[k]) === t),
    r => r.acc_code && (norm(`${r.acc_code} ${r.name}`) === t || norm(`${r.acc_code} - ${r.name}`) === t),
  ];
  for (const test of tests) {
    const hit = rows.filter(test);
    if (hit.length === 1) return hit[0].id;
    if (hit.length > 1) return null;
  }
  return null;
}

async function renderBulkGrid(resKey) {
  const r = RESOURCES.find(x => x.key === resKey);
  const bulkKey = BULK_KEYS[resKey];
  const st = bulkOf(resKey);
  const fields = r.fields;
  const refs = {};
  await Promise.all([...new Set(fields.filter(f => f.ref).map(f => f.ref))].map(async k => { refs[k] = await loadRef(k); }));
  if (state.current?.key !== 'bulk-' + resKey) return;

  const defaults = () => Object.fromEntries(fields.map(f => [f.name, f.type === 'bool' ? (f.default ?? false) : (typeof f.default === 'function' ? f.default() : (f.default ?? ''))]));
  const blank = () => ({ v: defaults(), errors: {} });
  const isEmpty = row => fields.every(f => f.type === 'bool' || row.v[f.name] === '' || row.v[f.name] === null || row.v[f.name] === undefined || (typeof f.default === 'function' && row.v[f.name] === f.default()));
  if (!st.rows.length) st.rows = Array.from({ length: 3 }, blank);

  const multiResolve = (f, text) => {
    const parts = String(text ?? '').split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
    const ids = [], missing = [];
    for (const p of parts) { const id = resolveRef(refs[f.ref], f.ref, p); id ? ids.push(id) : missing.push(p); }
    return { ids: [...new Set(ids)], missing };
  };
  const refName = (f, id) => { const rec = refs[f.ref].find(x => String(x.id) === String(id)); return rec ? (refLabel[f.ref] ? refLabel[f.ref](rec) : '#' + id) : '#' + id; };

  const cellHtml = (f, row) => {
    const v = row.v[f.name], bad = row.errors[f.name] ? ' bad' : '';
    const title = row.errors[f.name] ? ` title="${esc(row.errors[f.name])}"` : '';
    switch (f.type) {
      case 'bool': return `<td style="text-align:center"><input type="checkbox" data-k="${f.name}" ${v ? 'checked' : ''} style="width:auto"></td>`;
      case 'select': return `<td><select data-k="${f.name}" class="${bad}"${title}><option value=""></option>${f.options.map(o => `<option value="${esc(o.value)}" ${String(v) === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></td>`;
      case 'ref': return `<td><select data-k="${f.name}" class="${bad}"${title}>${optionsHtml(refs[f.ref], f.ref, v)}</select></td>`;
      case 'multiref': {
        const { ids, missing } = multiResolve(f, v);
        const note = missing.length ? `<div class="cellnote" style="color:var(--bad)">not found: ${esc(missing.join(', '))}</div>` : ids.length ? `<div class="cellnote" style="color:var(--muted)">${esc(ids.map(id => refName(f, id)).join(' · '))}</div>` : '';
        return `<td><input data-k="${f.name}" value="${esc(v)}" placeholder="names or ids, comma separated" list="dl-${f.ref}" class="${bad}"${title}>${note}</td>`;
      }
      case 'date': return `<td><input data-k="${f.name}" type="date" value="${esc(String(v ?? '').slice(0, 10))}" class="${bad}"${title}></td>`;
      case 'number': return `<td><input data-k="${f.name}" inputmode="decimal" value="${esc(v)}" class="num${bad}"${title}></td>`;
      default: return `<td><input data-k="${f.name}" value="${esc(v)}" class="${bad}"${title}></td>`;
    }
  };
  const rowHtml = (row, i) => {
    const msgs = [...new Set(Object.values(row.errors))];
    return `<tr data-i="${i}" class="${msgs.length ? 'rowerr' : ''}"><td class="num rn">${i + 1}</td>${fields.map(f => cellHtml(f, row)).join('')}
      <td><button type="button" class="small danger" data-del title="Remove row">×</button></td></tr>
      ${msgs.length ? `<tr class="errline"><td></td><td colspan="${fields.length + 1}">${msgs.map(esc).join(' · ')}</td></tr>` : ''}`;
  };

  const minWidth = 60 + fields.reduce((w, f) => w + ({ bool: 70, date: 150, number: 120, multiref: 240, ref: 220, textarea: 220 }[f.type] || 170), 0);
  $('#main').innerHTML = `
    <div class="titlebar">
      <div><h2>Bulk create — ${esc(r.label)}</h2><div class="endpoint">POST <code>/finance/${esc(resKey)}/create</code> with <code>{"${esc(bulkKey)}": [...]}</code> or a bare array · all saved or none · up to 500 rows</div></div>
      <div class="grow"></div><span class="endpoint">Tab moves across · Enter adds a row · paste straight from Excel</span>
    </div>
    <div class="filters" style="align-items:center">
      <b style="font-size:13px">Excel import</b>
      <input type="file" id="bgFile" accept=".xlsx,.xls,.csv,.tsv,.txt" style="width:auto;flex:0 1 260px">
      ${fields.some(f => f.type === 'date') ? `<div class="f" style="flex:0 1 150px;min-width:0"><label>Dates like 03/11/2026 are</label><select id="bgDateOrder"><option value="dmy" ${bulkState.dateOrder === 'dmy' ? 'selected' : ''}>DD/MM/YYYY</option><option value="mdy" ${bulkState.dateOrder === 'mdy' ? 'selected' : ''}>MM/DD/YYYY</option></select></div>` : ''}
      <button type="button" id="bgTemplate">Download template</button>
      <span class="endpoint" style="flex:1 1 260px">Headers are the column names below (or the API field names). Lookups match by name, code or id; several in one cell are comma separated.</span>
    </div>
    ${fields.filter(f => f.type === 'multiref').map(f => `<datalist id="dl-${f.ref}">${refs[f.ref].map(x => `<option value="${esc(refLabel[f.ref] ? refLabel[f.ref](x) : x.id)}">`).join('')}</datalist>`).join('')}
    <div id="bgErrors"></div>
    <div class="sheetwrap"><table class="sheet" style="min-width:${minWidth}px">
      <thead><tr><th style="width:36px">#</th>${fields.map(f => `<th${f.type === 'number' ? ' class="num"' : ''}>${esc(labelOf(f))}${f.required ? ' <span style="color:var(--bad)">*</span>' : ''}</th>`).join('')}<th style="width:34px"></th></tr></thead>
      <tbody id="bgRows"></tbody>
    </table></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0">
      <button type="button" id="bgAdd">+ Add row</button><button type="button" id="bgAdd10">+10 rows</button>
      <button type="button" id="bgClearEmpty">Clear empty rows</button><button type="button" class="danger" id="bgClearAll">Clear grid</button>
      <div style="flex:1"></div>
      <label class="endpoint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bgBare" style="width:auto" ${st.bare ? 'checked' : ''}> Send as a bare JSON array</label>
      <span class="endpoint" id="bgCount"></span>
      <button type="button" class="primary" id="bgSave">Create all</button>
    </div>
    <div id="bgOut">${st.result}</div>
    <details style="margin-top:14px"><summary class="endpoint" style="cursor:pointer">Request body (JSON) that Create all sends</summary><pre id="bgJson"></pre></details>`;

  const tbody = $('#bgRows');
  const draw = focus => {
    tbody.innerHTML = st.rows.map(rowHtml).join('');
    refresh();
    if (focus) tbody.querySelector(`tr[data-i="${focus.i}"] [data-k="${focus.k}"]`)?.focus();
  };
  const build = () => {
    const payload = [], index = [], problems = {};
    st.rows.forEach((row, i) => {
      if (isEmpty(row)) return;
      const body = {};
      for (const f of fields) {
        const v = row.v[f.name];
        if (f.type === 'bool') body[f.name] = !!v;
        else if (f.type === 'multiref') {
          const { ids, missing } = multiResolve(f, v);
          if (missing.length) (problems[i] ||= {})[f.name] = `${labelOf(f)}: not found — ${missing.join(', ')}`;
          if (ids.length || f.required) body[f.name] = ids;
        } else if (v === '' || v === null || v === undefined) continue;
        else if (f.type === 'ref') body[f.name] = Number(v);
        else if (f.type === 'number') body[f.name] = isNaN(Number(String(v).replace(/,/g, ''))) ? v : Number(String(v).replace(/,/g, ''));
        else body[f.name] = v;
      }
      payload.push(body); index.push(i);
    });
    return { payload, index, problems };
  };
  const refresh = () => {
    const { payload } = build();
    $('#bgCount').textContent = payload.length ? `${payload.length} row${payload.length === 1 ? '' : 's'} to send` : '';
    $('#bgJson').textContent = JSON.stringify(st.bare ? payload : { [bulkKey]: payload }, null, 2);
  };

  tbody.addEventListener('input', ev => {
    const el = ev.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.k) return;
    st.rows[+tr.dataset.i].v[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
    refresh();
  });
  tbody.addEventListener('change', ev => {
    const el = ev.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.k) return;
    const f = fields.find(x => x.name === el.dataset.k);
    if (f?.type === 'multiref') { const i = +tr.dataset.i; draw(); tbody.querySelector(`tr[data-i="${i}"] [data-k="${f.name}"]`)?.focus(); }
  });
  tbody.addEventListener('click', ev => {
    const b = ev.target.closest('[data-del]'); if (!b) return;
    st.rows.splice(+b.closest('tr').dataset.i, 1);
    if (!st.rows.length) st.rows.push(blank());
    draw();
  });
  tbody.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.target.tagName === 'BUTTON') return;
    ev.preventDefault();
    const i = +ev.target.closest('tr[data-i]').dataset.i, k = ev.target.dataset.k;
    if (i === st.rows.length - 1) st.rows.push(blank());
    draw({ i: i + 1, k });
  });
  tbody.addEventListener('paste', ev => {
    const text = ev.clipboardData?.getData('text/plain') || '';
    if (!/[\t\n]/.test(text.trim())) return;
    ev.preventDefault();
    const grid = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
    const at = +ev.target.closest('tr[data-i]').dataset.i;
    importGrid(grid, { at, col: Math.max(0, fields.findIndex(f => f.name === ev.target.dataset.k)) });
  });

  /* ----- import ----- */
  const headerKeys = f => [f.name, labelOf(f), f.name.replace(/_ids?$/, ''), f.name.replace(/_ids?$/, '').replace(/_/g, ' '), f.ref, f.ref && f.ref.replace(/-/g, ' ')].filter(Boolean).map(norm);
  const headerMap = row => {
    const map = {};
    row.forEach((h, idx) => { const t = norm(h).replace(/[:*]/g, '').trim(); const f = fields.find(x => !(x.name in map) && headerKeys(x).includes(t)); if (f) map[f.name] = idx; });
    return Object.keys(map).length >= Math.min(2, fields.length) ? map : null;
  };
  const convert = (f, raw, row) => {
    const s = raw instanceof Date ? raw : String(raw ?? '').trim();
    if (s === '') return;
    switch (f.type) {
      case 'bool': { const t = norm(s); row.v[f.name] = ['1', 'yes', 'y', 'true', 'active', 'x'].includes(t) ? true : ['0', 'no', 'n', 'false', 'inactive'].includes(t) ? false : row.v[f.name]; return; }
      case 'date': { const d = parseSheetDate(raw, bulkState.dateOrder); if (d) row.v[f.name] = d; else row.errors[f.name] = `${labelOf(f)}: “${s}” is not a date`; return; }
      case 'number': { const n = parseSheetAmount(raw); row.v[f.name] = typeof n === 'number' && !isNaN(n) ? String(n) : s; return; }
      case 'select': { const o = f.options.find(o => norm(o.value) === norm(s) || norm(o.label) === norm(s) || norm(o.label).startsWith(norm(s) + ' ')); if (o) row.v[f.name] = o.value; else row.errors[f.name] = `${labelOf(f)}: “${s}” is not an option`; return; }
      case 'ref': { const id = resolveRef(refs[f.ref], f.ref, s); if (id) row.v[f.name] = String(id); else row.errors[f.name] = `${labelOf(f)}: “${s}” not found or ambiguous`; return; }
      default: row.v[f.name] = String(s);
    }
  };
  function importGrid(grid, { at = null, col = 0 } = {}) {
    grid = grid.filter(rw => rw.some(v => String(v ?? '').trim() !== ''));
    if (!grid.length) return toast('Nothing to import.', true);
    let map = null, start = 0;
    for (let i = 0; i < Math.min(grid.length, 10); i++) if ((map = headerMap(grid[i]))) { start = i + 1; break; }
    if (!map) { map = {}; fields.slice(col).forEach((f, j) => { map[f.name] = j; }); }
    else col = 0;
    const merge = at !== null && col > 0 && !start;
    const made = grid.slice(start).map((src, j) => {
      const row = merge ? (st.rows[at + j] || blank()) : blank();
      if (merge) row.errors = {};
      for (const f of fields) if (f.name in map) convert(f, src[map[f.name]], row);
      return row;
    });
    if (at === null) st.rows = st.rows.filter(rw => !isEmpty(rw)).concat(made);
    else st.rows.splice(at, merge ? made.length : made.length, ...made);
    const flagged = made.filter(rw => Object.keys(rw.errors).length).length;
    toast(`Imported ${made.length} row${made.length === 1 ? '' : 's'}${flagged ? ` · ${flagged} need a look` : ''}`, !!flagged);
    if (st.rows.length > 500) toast(`The API takes 500 rows per request; you have ${st.rows.length}.`, true);
    draw();
  }

  $('#bgFile').onchange = async ev => {
    const file = ev.target.files[0]; if (!file) return;
    try {
      let grid;
      if (/\.(csv|tsv|txt)$/i.test(file.name)) {
        const text = await file.text();
        grid = parseDelimited(text, /\.tsv$/i.test(file.name) || text.split('\n')[0].includes('\t') ? '\t' : ',');
      } else {
        const XLSX = await loadSheetJs();
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
        grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
      }
      importGrid(grid);
    } catch (e) { toast('Could not read the file: ' + e.message, true); }
    ev.target.value = '';
  };
  if ($('#bgDateOrder')) $('#bgDateOrder').onchange = e => { bulkState.dateOrder = e.target.value; };
  $('#bgTemplate').onclick = () => {
    const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
    const csv = fields.map(f => q(labelOf(f))).join(',') + '\r\n';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `${resKey}-bulk-template.csv` });
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#bgBare').onchange = e => { st.bare = e.target.checked; refresh(); };
  $('#bgAdd').onclick = () => { st.rows.push(blank()); draw({ i: st.rows.length - 1, k: fields[0].name }); };
  $('#bgAdd10').onclick = () => { for (let i = 0; i < 10; i++) st.rows.push(blank()); draw(); };
  $('#bgClearEmpty').onclick = () => { st.rows = st.rows.filter(rw => !isEmpty(rw)); if (!st.rows.length) st.rows.push(blank()); draw(); };
  $('#bgClearAll').onclick = () => { if (!confirm('Remove all rows from the grid?')) return; st.rows = Array.from({ length: 3 }, blank); st.result = ''; $('#bgOut').innerHTML = ''; draw(); };

  $('#bgSave').onclick = async () => {
    st.rows.forEach(rw => { rw.errors = {}; });
    const { payload, index, problems } = build();
    if (!payload.length) return toast('The grid has no rows to send.', true);
    if (Object.keys(problems).length) {
      for (const [i, errs] of Object.entries(problems)) Object.assign(st.rows[i].errors, errs);
      draw();
      $('#bgErrors').innerHTML = `<div class="banner bad">Some lookups did not match (marked in red). Fix them before sending.</div>`;
      return;
    }
    $('#bgErrors').innerHTML = '';
    $('#bgSave').disabled = true;
    const res = await api('POST', `/finance/${resKey}/create`, { body: st.bare ? payload : { [bulkKey]: payload } });
    $('#bgSave').disabled = false;
    if (res.status === 201 || res.status === 200) {
      const made = [].concat(res.json.data);
      state.refCache = {};
      st.result = `<div class="banner" style="background:var(--ok-bg);color:var(--ok)">${esc(res.json.message || 'Saved')}</div>
        <div style="overflow:auto"><table><thead><tr><th>ID</th>${r.columns.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${
          made.map(rec => `<tr><td>${rec.id}</td>${r.columns.map(c => `<td class="${c[2] || ''}">${cell(c[1](rec))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      st.rows = Array.from({ length: 3 }, blank);
      toast(res.json.message || 'Saved');
      return renderBulkGrid(resKey);
    }
    // "<key>.3.name" -> row 3, Name cell; "<key>.3" -> row 3; anything else -> banner.
    const general = [];
    for (const [k, msgs] of Object.entries(res.json?.errors || {})) {
      const m = k.match(new RegExp(`^${bulkKey}\\.(\\d+)(?:\\.([\\w]+))?`)) || (st.bare ? k.match(/^(\d+)(?:\.(\w+))?/) : null);
      const text = [].concat(msgs).join(' ');
      const row = m ? st.rows[index[+m[1]]] : null;
      if (!row) { general.push(`${k}: ${text}`); continue; }
      const f = m[2] && fields.some(x => x.name === m[2]) ? m[2] : '_row';
      row.errors[f] = f === '_row' ? text : `${labelOf(fields.find(x => x.name === f))}: ${text}`;
    }
    draw();
    $('#bgErrors').innerHTML = `<div class="banner bad">${esc(apiError(res))}${res.status === 422 ? ' — nothing was saved.' : ''}${general.length ? `<ul style="margin:6px 0 0 18px">${general.map(g => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}</div>`;
  };

  draw();
}

/* ---------- bank statement report ---------- */
async function renderStatements() {
  const f = Object.assign({ from_date: today().slice(0, 8) + '01', to_date: today() }, state.filters);
  const [companies, accounts, charts] = await Promise.all([loadRef('companies'), loadRef('bank-accounts'), loadRef('chart-accounts')]);
  const accountsShown = f.company_id ? accounts.filter(a => (a.companies || []).some(c => String(c.id) === String(f.company_id))) : accounts;
  const picked = accounts.find(a => String(a.id) === String(f.bank_account_id));
  const opt = (rows, val, label, sel) => rows.map(r => `<option value="${esc(val(r))}" ${String(val(r)) === String(sel ?? '') ? 'selected' : ''}>${esc(label(r))}</option>`).join('');
  const byGroup = Object.entries(charts.reduce((m, c) => ((m[c.group?.name || 'No group'] ||= []).push(c), m), {}));

  $('#main').innerHTML = `
    <div class="titlebar"><div><h2>Bank Statement Report</h2><div class="endpoint">GET <code>/finance/statements</code> (all banks / company) · GET <code>/finance/statements/{bank_account_id}</code> (one account)</div></div></div>
    <form class="filters" id="stForm">
      <div class="f"><label>Company</label><select name="company_id"><option value="">All companies</option>${opt(companies, r => r.id, refLabel.companies, f.company_id)}</select></div>
      <div class="f"><label>Bank account</label><select name="bank_account_id"><option value="">All banks (company summary)</option>${opt(accountsShown, r => r.id, refLabel['bank-accounts'], f.bank_account_id)}</select></div>
      ${picked && (picked.currencies || []).length > 1 ? `<div class="f"><label>Currency</label><select name="currency_id">${opt(picked.currencies, r => r.id, r => r.code, f.currency_id)}</select></div>` : ''}
      <div class="f"><label>From date</label><input type="date" name="from_date" value="${esc(f.from_date)}"></div>
      <div class="f"><label>To date</label><input type="date" name="to_date" value="${esc(f.to_date)}"></div>
      ${picked ? `
      <div class="f"><label>Type</label><select name="type"><option value="">All</option>${opt([{ v: 'debit', l: 'Debit (Out)' }, { v: 'credit', l: 'Credit (In)' }], r => r.v, r => r.l, f.type)}</select></div>
      <div class="f"><label>Account</label><select name="chart_account_id"><option value="">All accounts</option>${byGroup.map(([g, rows]) => `<optgroup label="${esc(g)}">${opt(rows, r => r.id, refLabel['chart-accounts'], f.chart_account_id)}</optgroup>`).join('')}</select></div>
      <div class="f"><label>Status</label><select name="status"><option value="">Draft &amp; posted</option>${opt([{ v: 'draft', l: 'Drafts only' }, { v: 'posted', l: 'Posted only' }], r => r.v, r => r.l, f.status)}</select></div>` : ''}
      <div class="f" style="flex:0 0 auto;min-width:0"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="primary" type="submit">Run Report</button><button type="button" id="stReset">Reset</button>${picked ? '<button type="button" id="stExport">Export CSV</button>' : ''}</div></div>
    </form>
    <div id="stBody"><div class="empty">Loading…</div></div>`;

  const form = $('#stForm');
  const read = () => Object.fromEntries([...new FormData(form).entries()].filter(([, v]) => v !== ''));
  form.onsubmit = ev => { ev.preventDefault(); state.filters = read(); renderStatements(); };
  // Changing company or bank re-renders, so the bank list and extra filters follow.
  form.company_id.onchange = () => { state.filters = { ...read(), bank_account_id: undefined, currency_id: undefined }; renderStatements(); };
  form.bank_account_id.onchange = () => { state.filters = { ...read(), currency_id: undefined }; renderStatements(); };
  $('#stReset').onclick = () => { state.filters = {}; renderStatements(); };
  if ($('#stExport')) $('#stExport').onclick = async () => {
    const q = new URLSearchParams(Object.entries(read()).filter(([k]) => k !== 'company_id' && k !== 'bank_account_id')).toString();
    const res = await fetch(state.base.replace(/\/+$/, '') + `/finance/statements/${f.bank_account_id}/export?${q}`, { headers: { Authorization: 'Bearer ' + state.token, Accept: 'text/csv' } });
    if (!res.ok) return toast('Export failed (' + res.status + ')', true);
    const name = (res.headers.get('content-disposition') || '').match(/filename="?([^"]+)"?/)?.[1] || 'bank-statement.csv';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await res.blob()), download: name });
    a.click(); URL.revokeObjectURL(a.href);
  };

  const query = { ...f }; delete query.company_id;
  const res = picked
    ? await api('GET', `/finance/statements/${f.bank_account_id}`, { query: { ...query, bank_account_id: undefined } })
    : await api('GET', '/finance/statements', { query: { ...f, type: undefined, chart_account_id: undefined, status: undefined, currency_id: undefined } });
  if (state.current?.key !== 'statements') return;
  if (res.status !== 200) { $('#stBody').innerHTML = `<div class="banner bad">${esc(apiError(res))}</div>`; return; }
  const d = res.json.data;
  const num = (v, cls = '') => `<td class="num ${cls}${v < 0 ? ' neg' : ''}">${esc(money(v))}</td>`;
  const period = `<p class="endpoint">Period: <b>${esc(niceDate(d.from))}</b> → <b>${esc(niceDate(d.to))}</b></p>`;

  if (!picked) {
    const company = companies.find(c => String(c.id) === String(f.company_id));
    $('#stBody').innerHTML = `<h3>${esc(company ? company.name : 'All companies')} — All Banks</h3>${period}
      <div style="overflow:auto"><table><thead><tr><th>Bank</th><th>Account #</th><th>Currency</th><th class="num">Opening Balance</th><th class="num">Credit (In)</th><th class="num">Debit (Out)</th><th class="num">Net Movement</th><th class="num">Closing Balance</th><th class="num">Transactions</th><th></th></tr></thead>
      <tbody>${d.lines.length ? d.lines.map(l => `<tr><td>${esc(l.title)}${l.is_active ? '' : ' ' + pill('inactive').html}<div class="endpoint">${esc(l.bank || '')}</div></td><td>${esc(l.account_number || '-')}</td><td>${esc(l.currency)}</td>${num(l.opening_balance)}${num(l.credit_total)}${num(-l.debit_total)}${num(l.net_movement)}<td class="num"><b>${esc(money(l.closing_balance))}</b></td><td class="num">${l.transaction_count}</td>
        <td><button type="button" data-acc="${l.bank_account_id}" data-cur="${l.currency_id}">Statement</button></td></tr>`).join('') : '<tr><td colspan="10" class="empty">No bank accounts.</td></tr>'}</tbody>
      <tfoot>${d.totals_by_currency.map(t => `<tr style="font-weight:600"><td colspan="2">Total — ${esc(t.currency)} (${t.bank_count} bank${t.bank_count === 1 ? '' : 's'})</td><td>${esc(t.currency)}</td>${num(t.opening_balance)}${num(t.credit_total)}${num(-t.debit_total)}${num(t.net_movement)}${num(t.closing_balance)}<td class="num">${t.transaction_count}</td><td></td></tr>`).join('')}</tfoot></table></div>`;
    $('#stBody').querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { state.filters = { ...f, bank_account_id: b.dataset.acc, currency_id: b.dataset.cur }; renderStatements(); });
    return;
  }

  const cur = d.currency, A = d.account;
  const card = (title, value, sub = '') => `<div style="flex:1 1 180px;border:1px solid var(--line);border-radius:6px;padding:10px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">${title}</div><div style="font-size:18px;font-weight:700">${esc(cur)} ${esc(money(value))}</div>${sub ? `<div class="endpoint">${sub}</div>` : ''}</div>`;
  const breakdown = d.breakdown.map(s => `
    <tr style="background:var(--code);font-weight:600"><td colspan="6">${esc(s.label)} <span class="endpoint">— ${esc(s.type_label || '')}</span></td></tr>
    ${s.groups.map(g => `<tr><td colspan="6" style="padding-left:12px;font-weight:600">${esc(g.group)}</td></tr>
      ${g.accounts.map(a => `<tr><td class="endpoint">${esc(a.code)}</td><td style="padding-left:24px">${esc(a.name)}</td><td class="num">${a.transaction_count}</td>${num(a.credit_total)}${num(a.debit_total)}${num(a.net_total)}</tr>`).join('')}

      ${card('Opening Balance', d.opening_balance, 'as at ' + esc(niceDate(d.from)))}${card('Total Credit (In)', d.total_credit)}${card('Total Debit (Out)', d.total_debit)}${card('Closing Balance', d.closing_balance, 'as at ' + esc(niceDate(d.to)))}

    <div style="overflow:auto"><table><thead><tr><th>Date</th><th>Description</th><th>Account</th><th>Reference</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>
